spring.application.name=clyvo-vet-petcare
server.port=${SERVER_PORT:8080}

# Oracle datasource (env-driven so it works locally and in the cloud)
# URL e usuário têm defaults só pra DX local; senha é obrigatória via env.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:clyvo}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Retry datasource init while Oracle is warming up
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-timeout=30000
